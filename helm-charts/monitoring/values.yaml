namespace:
  name: monitoring
  create: true

prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 9090
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  config:
    scrapeInterval: 15s
    evaluationInterval: 15s

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 3000
  adminPassword: admin123
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

metricsServer:
  enabled: true
  image:
    repository: registry.k8s.io/metrics-server/metrics-server
    tag: v0.6.4
    pullPolicy: IfNotPresent
  service:
    port: 443
  resources:
    requests:
      cpu: 100m
      memory: 200Mi

kubeStateMetrics:
  enabled: true
  image:
    repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
    tag: v2.10.0
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

nodeExporter:
  enabled: true
  image:
    repository: prom/node-exporter
    tag: v1.7.0
    pullPolicy: IfNotPresent
  service:
    port: 9100
  resources:
    requests:
      cpu: 102m
      memory: 180Mi
    limits:
      cpu: 250m
      memory: 180Mi